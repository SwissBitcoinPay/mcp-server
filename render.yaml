# The hosted assistant on Render's free plan, made by the Deploy to Render button of README.md and
# docs/SELF-HOSTING.md (option C). The button deploys the branch `stable`: the latest release, which
# release.yml moves there once published (never `main`, which holds what is not released yet).
#
# - One instance (the free plan never scales out): invoices are made one at a time per key within
#   one process (SPEC.md §17).
# - Its address: Render's own https://<name>.onrender.com (RENDER_EXTERNAL_URL, read by
#   src/hosted/settings.ts when MCP_PUBLIC_URL is unset). Clients and tokens are bound to it: a
#   custom domain added later (MCP_PUBLIC_URL) means every merchant connects again.
# - Its secret, MCP_SEAL_SECRET: generated by Render (256 random bits), never in git nor typed.
#   Changing it ends every connection.
# - No automatic deployment: the instance runs the release it was made with until it is deployed
#   again (Render: Manual Deploy › Deploy latest commit), after each release.
services:
  - type: web
    name: sattleme-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Data in the EU, the closest region to Switzerland (render.com/docs/regions).
    region: frankfurt
    healthCheckPath: /health
    autoDeployTrigger: "off"
    # A stop lets the requests in flight finish (src/http.ts), as docker-compose.yml's
    # stop_grace_period: an invoice cut between its number and its publication would leave a gap
    # in the merchant's series (SPEC.md §13).
    maxShutdownDelaySeconds: 60
    envVars:
      - key: MCP_SEAL_SECRET
        generateValue: true
      # The port the server listens on, which Render forwards to (the image's EXPOSE).
      - key: PORT
        value: "8080"
      # One hop trusted: the address Render's proxy adds last, which a client cannot forge. Render's
      # proxies are not documented: the rate limits per address may count several clients as one
      # (docs/SELF-HOSTING.md, option C).
      - key: MCP_TRUST_PROXY
        value: "1"
      - key: MCP_TIME_ZONE
        value: Europe/Zurich
      - key: MCP_LANGUAGE
        value: fr
